# 將整個靜態網站部署到 GitHub Pages。
# 啟用步驟：GitHub 倉庫 Settings → Pages → Source 選「GitHub Actions」，
# 再於同頁 Custom domain 填入 www.analyst.sme-clinic-ai.com。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/website-design-pages-74x4d8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
